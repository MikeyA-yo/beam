<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beam</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1d21;
    --muted: #6b7079;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --border: #e2e4e8;
    --track: #e7e9ee;
    --ok: #15803d;
    --bad: #c62828;
    --warn-bg: #fff4e5;
    --warn-text: #7a4100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --text: #e8eaed;
      --muted: #9aa0a8;
      --accent: #4f8cff;
      --accent-text: #0b0d10;
      --border: #2c3038;
      --track: #2c3038;
      --ok: #4ade80;
      --bad: #ff6b6b;
      --warn-bg: #3a2a10;
      --warn-text: #ffd59a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  h2 { font-size: 1.1rem; margin: 0; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .banner {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-weight: 600;
  }
  .pick {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 15px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .pick:active { opacity: 0.85; }
  .pick input { display: none; }
  .hint, .empty { color: var(--muted); font-size: 0.9rem; margin: 8px 0 0; }
  .summary { color: var(--muted); font-size: 0.9rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  #uploads:not(:empty) { margin-top: 12px; }
  .item { padding: 10px 0; border-top: 1px solid var(--border); }
  .item:first-child { border-top: 0; }
  .line { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-weight: 500; }
  .size { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  .status { color: var(--muted); font-size: 0.9rem; min-width: 0; overflow-wrap: anywhere; }
  .item[data-state="done"] .status { color: var(--ok); }
  .item[data-state="failed"] .status { color: var(--bad); }
  progress {
    display: block;
    width: 100%;
    height: 8px;
    margin: 8px 0 6px;
    border: 0;
    border-radius: 4px;
    background: var(--track);
    overflow: hidden;
    appearance: none;
  }
  progress::-webkit-progress-bar { background: var(--track); }
  progress::-webkit-progress-value { background: var(--accent); transition: width 0.2s; }
  progress::-moz-progress-bar { background: var(--accent); }
  .item[data-state="done"] progress::-webkit-progress-value { background: var(--ok); }
  .item[data-state="done"] progress::-moz-progress-bar { background: var(--ok); }
  .item[data-state="failed"] progress::-webkit-progress-value { background: var(--bad); }
  .item[data-state="failed"] progress::-moz-progress-bar { background: var(--bad); }
  button.small {
    min-height: 40px;
    min-width: 72px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    flex: none;
  }
  button.small:active { background: var(--track); }
  button.small:disabled { opacity: 0.5; }
  #files .file {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  #files .file:first-child { border-top: 0; }
  .info { flex: 1; min-width: 0; }
  .info .name { display: block; }
  .meta { color: var(--muted); font-size: 0.85rem; }
  a.dl {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 96px;
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    text-decoration: none;
  }
  a.dl:active { opacity: 0.85; }
  .tools { display: flex; align-items: center; gap: 10px; }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .live::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .live[data-state="live"]::before { background: var(--ok); }
  .live[data-state="reconnecting"]::before { background: var(--bad); }
  textarea {
    display: block;
    width: 100%;
    min-height: 96px;
    resize: vertical;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  .buttons { display: flex; gap: 10px; margin-top: 10px; }
  .buttons > * { flex: 1; min-width: 0; }
  .act {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 10px 12px;
    border: 1px solid var(--accent);
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .act.alt { background: transparent; color: var(--text); border-color: var(--border); }
  .act:active { opacity: 0.85; }
  button.act:disabled, label.act[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
  .act input { display: none; }
  #clip-status { min-height: 1.45em; margin: 10px 0 0; font-size: 0.9rem; color: var(--muted); }
  #clip-status[data-tone="ok"] { color: var(--ok); }
  #clip-status[data-tone="bad"] { color: var(--bad); }
  #clip-preview { margin-top: 12px; }
  #clip-preview img {
    display: block;
    max-width: 100%;
    max-height: 60vh;
    margin: 0 auto 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Beam</h1>

  <div class="banner" id="banner" role="alert" hidden>
    Not connected anymore. Scan the QR code on the PC again.
  </div>

  <section id="send">
    <div class="head">
      <h2>Send to PC</h2>
      <span class="summary" id="upload-summary" aria-live="polite"></span>
    </div>
    <label class="pick">
      Choose files
      <input id="file-input" type="file" multiple>
    </label>
    <p class="hint">Keep this page open until your files are sent.</p>
    <ul id="uploads"></ul>
    <div class="line" id="upload-tools" hidden>
      <span></span>
      <button class="small" id="clear-done" type="button">Clear finished</button>
    </div>
  </section>

  <section id="clip">
    <div class="head">
      <h2>Clipboard</h2>
    </div>
    <textarea id="clip-text" placeholder="Type here, or long-press and tap Paste" aria-label="Clipboard text"></textarea>
    <div class="buttons">
      <button class="act" id="clip-send" type="button">Send to PC</button>
      <button class="act" id="clip-get" type="button">Get from PC</button>
    </div>
    <div class="buttons">
      <button class="act alt" id="clip-copy" type="button">Copy</button>
      <label class="act alt" id="clip-image-pick">
        Send an image
        <input id="clip-image" type="file" accept="image/*">
      </label>
    </div>
    <p id="clip-status" aria-live="polite"></p>
    <div id="clip-preview" hidden>
      <img id="clip-img" alt="Image from the PC's clipboard">
      <div class="line">
        <span class="hint">Long-press the image to copy it.</span>
        <a class="dl" id="clip-save" href="#">Save</a>
      </div>
    </div>
  </section>

  <section id="receive">
    <div class="head">
      <h2>On PC</h2>
      <div class="tools">
        <span class="live" id="live" data-state="connecting" aria-live="polite">Connecting…</span>
        <button class="small" id="refresh" type="button">Refresh</button>
      </div>
    </div>
    <p class="empty" id="files-empty">Loading…</p>
    <ul id="files"></ul>
  </section>
</main>

<script>
(() => {
  "use strict";

  // Two at a time keeps the Wi-Fi busy while each file still gets its own
  // progress bar. More rarely helps, because the link is the limit.
  const MAX_PARALLEL = 2;
  const SPEED_WINDOW_MS = 2000;

  const input = document.getElementById("file-input");
  const list = document.getElementById("uploads");
  const summary = document.getElementById("upload-summary");
  const tools = document.getElementById("upload-tools");
  const clearDone = document.getElementById("clear-done");
  const banner = document.getElementById("banner");

  const items = [];
  let active = 0;
  let expired = false;

  input.addEventListener("change", () => {
    // The browser hands us File handles. Nothing is read into memory here:
    // XMLHttpRequest streams each file from storage as it sends it.
    for (const file of input.files) addItem(file);
    input.value = ""; // so picking the same file again still fires "change"
    pump();
  });

  clearDone.addEventListener("click", () => {
    for (let i = items.length - 1; i >= 0; i--) {
      if (items[i].state === "done" || items[i].state === "cancelled") {
        items[i].row.li.remove();
        items.splice(i, 1);
      }
    }
    updateSummary();
  });

  window.addEventListener("beforeunload", (e) => {
    if (items.some((it) => it.state === "uploading" || it.state === "queued")) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  function addItem(file) {
    const row = buildRow(file);
    const item = { file, row, state: "queued", xhr: null };
    row.cancel.addEventListener("click", () => cancel(item));
    row.retry.addEventListener("click", () => retry(item));
    items.push(item);
    list.append(row.li);
    setState(item, "queued", "Waiting…");
  }

  function buildRow(file) {
    const li = el("li", "item");
    const top = el("div", "line");
    const name = el("span", "name", file.name);
    name.title = file.name;
    top.append(name, el("span", "size", formatBytes(file.size)));

    const bar = document.createElement("progress");
    bar.max = 1;
    bar.value = 0;

    const bottom = el("div", "line");
    const status = el("span", "status");
    const cancel = el("button", "small", "Cancel");
    const retry = el("button", "small", "Retry");
    cancel.type = retry.type = "button";
    bottom.append(status, cancel, retry);

    li.append(top, bar, bottom);
    return { li, bar, status, cancel, retry };
  }

  function pump() {
    if (expired) return;
    for (const item of items) {
      if (active >= MAX_PARALLEL) break;
      if (item.state === "queued") start(item);
    }
    updateSummary();
  }

  function start(item) {
    const xhr = new XMLHttpRequest();
    const samples = [];
    item.xhr = xhr;
    active++;
    setState(item, "uploading", "Starting…");

    xhr.upload.addEventListener("progress", (e) => {
      if (!e.lengthComputable || e.total === 0) return;
      const frac = e.loaded / e.total;
      item.row.bar.value = frac;
      if (frac >= 1) {
        // The bytes are sent; the PC is moving the file into place.
        item.row.status.textContent = "Finishing…";
        return;
      }
      const now = performance.now();
      samples.push([now, e.loaded]);
      while (samples.length > 2 && now - samples[0][0] > SPEED_WINDOW_MS) samples.shift();
      const [t0, b0] = samples[0];
      const pct = Math.floor(frac * 100) + "%";
      if (now - t0 < 250) {
        item.row.status.textContent = pct;
        return;
      }
      const speed = ((e.loaded - b0) * 1000) / (now - t0); // bytes per second
      let text = `${pct} · ${formatBytes(speed)}/s`;
      // A time estimate needs a second of data to be worth showing.
      if (speed > 0 && now - t0 >= 1000) text += ` · ${formatEta((e.total - e.loaded) / speed)}`;
      item.row.status.textContent = text;
    });

    xhr.addEventListener("load", () => {
      if (!settle(item, xhr)) return;
      if (xhr.status === 200) {
        succeed(item, parseJson(xhr.responseText));
      } else if (xhr.status === 401) {
        expire();
        setState(item, "failed", "Not connected. Scan the QR code again.");
      } else {
        const msg = parseJson(xhr.responseText)?.error;
        failed(item, msg ? capitalize(msg) + "." : `The PC refused the file (error ${xhr.status}).`);
      }
      pump();
    });
    xhr.addEventListener("error", () => {
      if (!settle(item, xhr)) return;
      failed(item, "Connection lost. Check the Wi-Fi, then tap Retry.");
      pump();
    });
    xhr.addEventListener("abort", () => {
      if (!settle(item, xhr)) return;
      setState(item, "cancelled", "Cancelled");
      pump();
    });

    const form = new FormData();
    form.append("file", item.file, item.file.name);
    xhr.open("POST", "/api/upload");
    xhr.send(form);
  }

  // Marks the request as finished exactly once, whichever event fires.
  function settle(item, xhr) {
    if (item.xhr !== xhr) return false;
    item.xhr = null;
    active--;
    return true;
  }

  function succeed(item, body) {
    const saved = body?.files?.[0]?.name;
    let text = "Sent";
    if (saved && saved !== item.file.name) text += ` · saved as “${saved}”`;
    item.row.bar.value = 1;
    setState(item, "done", text);
    // With live updates on, the server's upload_completed event updates the list.
    if (!socket || socket.readyState !== WebSocket.OPEN) refreshSoon();
  }

  function failed(item, message) {
    setState(item, "failed", message);
  }

  function cancel(item) {
    if (item.state === "uploading" && item.xhr) {
      item.xhr.abort(); // the server deletes the partial file
    } else if (item.state === "queued") {
      setState(item, "cancelled", "Cancelled");
      pump();
    }
  }

  function retry(item) {
    if (expired) return;
    item.row.bar.value = 0;
    setState(item, "queued", "Waiting…");
    pump();
  }

  // ---- On PC: listing and downloads ----

  const fileList = document.getElementById("files");
  const filesEmpty = document.getElementById("files-empty");
  const refreshBtn = document.getElementById("refresh");
  let loading = null;
  let refreshTimer = 0;

  refreshBtn.addEventListener("click", () => loadFiles());

  // Many uploads can finish in a burst; refetch once after they settle.
  function refreshSoon() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(loadFiles, 400);
  }

  const filesByName = new Map();
  // Events that arrive while a list request is in flight. Replayed on top of
  // the response, because the response may be older than the events.
  let eventsDuringLoad = [];

  function loadFiles() {
    if (expired) return Promise.resolve();
    if (loading) return loading; // one request at a time
    refreshBtn.disabled = true;
    eventsDuringLoad = [];
    loading = fetch("/api/files", { cache: "no-store" })
      .then((res) => {
        if (res.status === 401) { expire(); return null; }
        if (!res.ok) throw new Error(`error ${res.status}`);
        return res.json();
      })
      .then((body) => {
        if (!body) return;
        filesByName.clear();
        for (const f of body.files || []) filesByName.set(f.name, f);
        for (const ev of eventsDuringLoad) applyEvent(ev);
        renderFiles();
      })
      .catch(() => {
        filesEmpty.hidden = false;
        filesEmpty.textContent = "Couldn't load the list. Check the Wi-Fi, then tap Refresh.";
      })
      .finally(() => { loading = null; eventsDuringLoad = []; refreshBtn.disabled = expired; });
    return loading;
  }

  // Upserts and removals are idempotent, so replaying an event is harmless.
  function applyEvent(ev) {
    if (ev.type === "file_added" || ev.type === "upload_completed") {
      filesByName.set(ev.name, { name: ev.name, size: ev.size, modified: ev.modified });
    } else if (ev.type === "file_removed") {
      filesByName.delete(ev.name);
    }
  }

  function renderFiles() {
    const files = [...filesByName.values()].sort((a, b) =>
      b.modified - a.modified || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
    const rows = files.map((f) => {
      const li = el("li", "file");
      const info = el("div", "info");
      const name = el("span", "name", f.name);
      name.title = f.name;
      info.append(name, el("span", "meta", `${formatBytes(f.size)} · ${formatWhen(f.modified)}`));
      const link = el("a", "dl", "Download");
      link.href = "/api/files/" + encodeURIComponent(f.name);
      link.download = f.name;
      link.setAttribute("aria-label", `Download ${f.name}`);
      li.append(info, link);
      return li;
    });
    fileList.replaceChildren(...rows);
    filesEmpty.hidden = files.length > 0;
    filesEmpty.textContent = "No files yet. Put files in the shared folder on the PC.";
  }

  function formatWhen(secs) {
    if (!secs) return "";
    const d = new Date(secs * 1000);
    const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const startOfToday = new Date().setHours(0, 0, 0, 0);
    const dayMs = 24 * 60 * 60 * 1000;
    if (d >= startOfToday) return `Today ${time}`;
    if (d >= startOfToday - dayMs) return `Yesterday ${time}`;
    const sameYear = d.getFullYear() === new Date().getFullYear();
    const date = d.toLocaleDateString([], sameYear
      ? { day: "numeric", month: "short" }
      : { day: "numeric", month: "short", year: "numeric" });
    return `${date}, ${time}`;
  }

  // ---- Clipboard ----

  // As a 24-bit bitmap this is about 96 MB, under the PC's 128 MB limit.
  // Bigger photos are scaled down to it.
  const MAX_CLIP_PIXELS = 32000000;

  const clipText = document.getElementById("clip-text");
  const clipSend = document.getElementById("clip-send");
  const clipGet = document.getElementById("clip-get");
  const clipCopy = document.getElementById("clip-copy");
  const clipPick = document.getElementById("clip-image-pick");
  const clipImageInput = document.getElementById("clip-image");
  const clipStatus = document.getElementById("clip-status");
  const clipPreview = document.getElementById("clip-preview");
  const clipImg = document.getElementById("clip-img");
  const clipSave = document.getElementById("clip-save");
  let clipBusy = false;
  let clipUrl = "";

  clipSend.addEventListener("click", () => clipAction(async () => {
    const text = clipText.value;
    if (!text) {
      clipSay("Type or paste something first.", "bad");
      return;
    }
    const xhr = await clipRequest("PUT", text, "text/plain;charset=utf-8", "Sending…");
    if (xhr) clipSay("Sent. Paste it on the PC.", "ok");
  }));

  clipGet.addEventListener("click", () => clipAction(async () => {
    const xhr = await clipRequest("GET", null, null, "Getting…");
    if (!xhr) return;
    const type = xhr.getResponseHeader("Content-Type") || "";
    if (xhr.status === 204 || !xhr.response) {
      clipSay("Nothing to get. Copy some text, an image, or an image file on the PC first.", "");
    } else if (type.startsWith("text/")) {
      const text = await xhr.response.text();
      clipText.value = text;
      hidePreview();
      clipSay(copyText(text) ? "Copied from the PC." : "Got it from the PC. Tap Copy to copy it.", "ok");
    } else if (type.startsWith("image/")) {
      showImage(xhr.response, type);
      clipSay("Got an image from the PC.", "ok");
    }
  }));

  clipCopy.addEventListener("click", () => {
    if (!clipText.value) {
      clipSay("Nothing to copy yet.", "bad");
    } else if (copyText(clipText.value)) {
      clipSay("Copied.", "ok");
    } else {
      clipSay("Couldn't copy. Long-press the text and tap Copy.", "bad");
    }
  });

  clipImageInput.addEventListener("change", () => {
    const file = clipImageInput.files[0];
    clipImageInput.value = "";
    if (file) sendImage(file);
  });

  // Pasting an image into the box sends it, where the phone's keyboard
  // or browser supports pasting images.
  clipText.addEventListener("paste", (e) => {
    const file = [...(e.clipboardData?.files || [])].find((f) => f.type.startsWith("image/"));
    if (!file) return;
    e.preventDefault();
    sendImage(file);
  });

  function sendImage(file) {
    clipAction(async () => {
      clipSay("Preparing the image…", "");
      let bmp;
      try {
        bmp = await toBmp(file);
      } catch {
        clipSay("Couldn't read that image.", "bad");
        return;
      }
      const xhr = await clipRequest("PUT", bmp, "image/bmp", "Sending…");
      if (xhr) clipSay("Image sent. Paste it on the PC.", "ok");
    });
  }

  // One clipboard request at a time; the buttons are disabled meanwhile.
  async function clipAction(run) {
    if (clipBusy || expired) return;
    clipBusy = true;
    setClipButtons();
    try {
      await run();
    } finally {
      clipBusy = false;
      setClipButtons();
    }
  }

  // Resolves to the finished request, or null after showing what went wrong.
  function clipRequest(method, body, type, busyText) {
    clipSay(busyText, "");
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open(method, "/api/clipboard");
      xhr.responseType = "blob";
      if (type) xhr.setRequestHeader("Content-Type", type);
      if (body instanceof Blob && body.size > 1000000) {
        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable) clipSay(`Sending… ${Math.floor((e.loaded / e.total) * 100)}%`, "");
        });
      }
      xhr.addEventListener("load", async () => {
        if (xhr.status < 400) { resolve(xhr); return; }
        if (xhr.status === 401) {
          expire();
          clipSay("Not connected. Scan the QR code again.", "bad");
        } else {
          // A 413 from the body limit has no message; one from Beam does.
          const msg = parseJson(await xhr.response.text())?.error;
          if (msg) clipSay(capitalize(msg) + ".", "bad");
          else if (xhr.status === 413) clipSay("That's too large for the clipboard.", "bad");
          else clipSay(`The PC couldn't do that (error ${xhr.status}).`, "bad");
        }
        resolve(null);
      });
      xhr.addEventListener("error", () => {
        clipSay("Connection lost. Check the Wi-Fi and try again.", "bad");
        resolve(null);
      });
      xhr.send(body);
    });
  }

  // The modern clipboard API needs HTTPS, which Beam doesn't have yet, so
  // this uses the older copy command on a hidden, read-only text box
  // (read-only so the phone's keyboard doesn't pop up). It has to run
  // soon after a tap, which it does.
  function copyText(text) {
    const box = document.createElement("textarea");
    box.value = text;
    box.readOnly = true;
    box.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
    document.body.append(box);
    box.select();
    box.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    box.remove();
    return ok;
  }

  function showImage(blob, type) {
    if (clipUrl) URL.revokeObjectURL(clipUrl);
    clipUrl = URL.createObjectURL(blob);
    clipImg.src = clipUrl;
    clipSave.href = clipUrl;
    const stamp = new Date().toISOString().slice(0, 19).replace(/[-:]/g, "").replace("T", "-");
    const ext = { "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif", "image/webp": "webp" };
    clipSave.download = `clipboard-${stamp}.${ext[type.split(";")[0].trim()] || "bmp"}`;
    clipPreview.hidden = false;
  }

  function hidePreview() {
    clipPreview.hidden = true;
    if (clipUrl) URL.revokeObjectURL(clipUrl);
    clipUrl = "";
    clipImg.removeAttribute("src");
  }

  // The PC can't decode JPEG or HEIC without an image library, but the
  // phone's browser can. So the phone draws the image and sends plain
  // pixels: a 24-bit bitmap, bottom-up, the layout every Windows app reads.
  async function toBmp(file) {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, Math.sqrt(MAX_CLIP_PIXELS / (bitmap.width * bitmap.height)));
    const width = Math.max(1, Math.round(bitmap.width * scale));
    const height = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    // 24-bit has no transparency; see-through parts become white.
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(bitmap, 0, 0, width, height);
    bitmap.close();
    const rgba = ctx.getImageData(0, 0, width, height).data;
    canvas.width = canvas.height = 0; // let the phone free the canvas now

    const stride = Math.ceil((width * 3) / 4) * 4;
    const size = 54 + stride * height;
    const buf = new ArrayBuffer(size);
    const view = new DataView(buf);
    const out = new Uint8Array(buf);
    view.setUint8(0, 0x42); // "BM"
    view.setUint8(1, 0x4d);
    view.setUint32(2, size, true);
    view.setUint32(10, 54, true); // pixels start right after the headers
    view.setUint32(14, 40, true); // BITMAPINFOHEADER
    view.setInt32(18, width, true);
    view.setInt32(22, height, true); // positive: bottom row first
    view.setUint16(26, 1, true); // planes
    view.setUint16(28, 24, true); // bits per pixel
    view.setUint32(34, stride * height, true);
    for (let y = 0; y < height; y++) {
      let src = (height - 1 - y) * width * 4;
      let dst = 54 + y * stride;
      for (let x = 0; x < width; x++, src += 4, dst += 3) {
        out[dst] = rgba[src + 2]; // blue
        out[dst + 1] = rgba[src + 1]; // green
        out[dst + 2] = rgba[src]; // red
      }
    }
    return new Blob([buf], { type: "image/bmp" });
  }

  function setClipButtons() {
    const off = clipBusy || expired;
    clipSend.disabled = clipGet.disabled = off;
    clipPick.setAttribute("aria-disabled", String(off));
  }

  function clipSay(text, tone) {
    clipStatus.textContent = text;
    clipStatus.dataset.tone = tone;
  }

  // ---- Live updates over a WebSocket ----

  const live = document.getElementById("live");
  const RETRY_MIN_MS = 1000;
  const RETRY_MAX_MS = 15000;
  let socket = null;
  let retryDelay = RETRY_MIN_MS;
  let retryTimer = 0;

  function connect() {
    if (expired || socket) return;
    clearTimeout(retryTimer);
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    socket = ws;
    ws.addEventListener("open", () => {
      retryDelay = RETRY_MIN_MS;
      setLive("live", "Live");
      // Fetch after subscribing, so nothing that changes in between is missed.
      loadFiles();
    });
    ws.addEventListener("message", (e) => {
      const ev = parseJson(e.data);
      if (!ev) return;
      if (ev.type === "resync") { loadFiles(); return; }
      applyEvent(ev);
      if (loading) eventsDuringLoad.push(ev);
      renderFiles();
    });
    ws.addEventListener("close", () => {
      if (socket !== ws) return;
      socket = null;
      if (expired) return;
      setLive("reconnecting", "Reconnecting…");
      // A refused handshake looks like any other close. Asking the API tells
      // us whether the session ended (401 shows the banner) or the PC is
      // just unreachable.
      loadFiles();
      const jitter = 0.75 + Math.random() * 0.5;
      retryTimer = setTimeout(connect, retryDelay * jitter);
      retryDelay = Math.min(retryDelay * 2, RETRY_MAX_MS);
    });
  }

  // Phones pause background tabs; reconnect right away on return.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !socket && !expired) {
      retryDelay = RETRY_MIN_MS;
      connect();
    }
  });

  function setLive(state, text) {
    live.dataset.state = state;
    live.textContent = text;
  }

  function expire() {
    if (expired) return;
    expired = true;
    banner.hidden = false;
    refreshBtn.disabled = true;
    setClipButtons();
    clearTimeout(retryTimer);
    live.hidden = true;
    if (socket) {
      const ws = socket;
      socket = null;
      ws.close();
    }
    for (const item of items) {
      if (item.state === "queued") setState(item, "failed", "Not sent. Scan the QR code again.");
    }
  }

  function setState(item, state, text) {
    item.state = state;
    item.row.li.dataset.state = state;
    item.row.status.textContent = text;
    item.row.cancel.hidden = !(state === "queued" || state === "uploading");
    item.row.retry.hidden = expired || !(state === "failed" || state === "cancelled");
    updateSummary();
  }

  function updateSummary() {
    const total = items.length;
    const done = items.filter((it) => it.state === "done").length;
    const bad = items.filter((it) => it.state === "failed").length;
    const finished = items.some((it) => it.state === "done" || it.state === "cancelled");
    if (total === 0) {
      summary.textContent = "";
    } else {
      summary.textContent = `${done} of ${total} sent` + (bad ? ` · ${bad} failed` : "");
    }
    tools.hidden = !finished;
    // Progress stays visible from the tab strip while browsing elsewhere.
    const busy = items.some((it) => it.state === "uploading" || it.state === "queued");
    document.title = busy ? `(${done}/${total}) Beam` : "Beam";
  }

  function parseJson(text) {
    try { return JSON.parse(text); } catch { return null; }
  }

  function formatEta(secs) {
    if (!isFinite(secs)) return "";
    if (secs < 60) return `${Math.max(1, Math.round(secs))} s left`;
    if (secs < 3600) return `${Math.round(secs / 60)} min left`;
    const h = Math.floor(secs / 3600);
    return `${h} h ${Math.round((secs - h * 3600) / 60)} min left`;
  }

  function capitalize(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // Same 1024-based units as the PC's terminal and Windows Explorer.
  function formatBytes(n) {
    const units = ["B", "KB", "MB", "GB", "TB"];
    let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    if (i === 0) return `${Math.round(n)} B`;
    return `${n.toFixed(n < 10 ? 1 : 0)} ${units[i]}`;
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  connect();
})();
</script>
</body>
</html>

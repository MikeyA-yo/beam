<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beam</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1d21;
    --muted: #6b7079;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --border: #e2e4e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --text: #e8eaed;
      --muted: #9aa0a8;
      --accent: #4f8cff;
      --accent-text: #0b0d10;
      --border: #2c3038;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .pick {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
  }
  .pick input { display: none; }
  .empty { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Beam</h1>

  <section id="send">
    <h2>Send to PC</h2>
    <label class="pick">
      Choose files
      <input id="file-input" type="file" multiple>
    </label>
    <ul id="uploads"></ul>
  </section>

  <section id="receive">
    <h2>On PC</h2>
    <p class="empty" id="files-empty">No files yet.</p>
    <ul id="files"></ul>
  </section>
</main>
</body>
</html>

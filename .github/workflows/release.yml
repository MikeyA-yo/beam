# Push a tag like v1.0.0 (matching the version in Cargo.toml) to build Beam
# for each platform and attach it to a draft GitHub Release. Review the
# draft on GitHub, then publish it.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Bundles the C runtime, so the .exe runs on PCs without the
            # Visual C++ redistributable installed.
            rustflags: -C target-feature=+crt-static
          - name: linux-x86_64
            os: ubuntu-latest
            # musl gives one static binary that runs on any distribution.
            target: x86_64-unknown-linux-musl
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --profile dist --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package
        shell: bash
        run: |
          name="beam-$GITHUB_REF_NAME-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/dist/beam"
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            # A bare .exe, so it runs with a double-click, no unzipping.
            cp "$bin.exe" "dist/$name.exe"
          else
            # A tarball keeps the executable bit.
            mkdir "$name"
            cp "$bin" README.md LICENSE-MIT LICENSE-APACHE "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*

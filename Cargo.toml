[package]
name = "beam"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
local-ip-address = "0.6.13"
notify = "8.2.2"
qr2term = "0.3.3"
rand = "0.10.3"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
tempfile = "3.27.0"

# Only for SO_EXCLUSIVEADDRUSE in src/socket.rs. Same version clap already pulls in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }
